server {
    listen 59886;
    listen [::]:59886;
    server_name gallery.example.com;

    root /opt/codex-anima-html/public;
    index index.html;

    add_header Content-Security-Policy "default-src 'self'; img-src 'self' https: data: blob:; media-src 'self' https: blob:; connect-src 'self'; script-src 'self'; style-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    location = /index.html {
        expires -1;
        try_files $uri =404;
    }

    location /css/ {
        expires 5m;
        try_files $uri =404;
    }

    location /js/ {
        expires 5m;
        try_files $uri =404;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:4173;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
        proxy_request_buffering off;
    }

    location / {
        expires -1;
        try_files $uri $uri/ =404;
    }
}
