<!doctype html>
<html lang="zh-CN" data-theme="light" data-accent="blue">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="多站点图片与视频图库浏览器">
  <title>Atlas Gallery</title>
  <link rel="stylesheet" href="/css/styles.css?v=2.0.0">
</head>
<body>
  <svg class="icon-sprite" aria-hidden="true">
    <symbol id="icon-gallery" viewBox="0 0 24 24">
      <path d="M4 4h16v16H4zM4 16l4-4 3 3 3-4 6 6M9 9h.01" />
    </symbol>
    <symbol id="icon-search" viewBox="0 0 24 24">
      <circle cx="11" cy="11" r="7" />
      <path d="m20 20-4-4" />
    </symbol>
    <symbol id="icon-tune" viewBox="0 0 24 24">
      <path d="M4 7h10M18 7h2M4 17h2M10 17h10M14 4v6M6 14v6" />
    </symbol>
    <symbol id="icon-refresh" viewBox="0 0 24 24">
      <path d="M20 6v5h-5M4 18v-5h5M18 9a7 7 0 0 0-12-2M6 15a7 7 0 0 0 12 2" />
    </symbol>
    <symbol id="icon-favorite" viewBox="0 0 24 24">
      <path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.6a5.5 5.5 0 0 0 0-7.8Z" />
    </symbol>
    <symbol id="icon-fire" viewBox="0 0 24 24">
      <path d="M12 22c4 0 7-3 7-7 0-5-4-8-7-13 0 4-2 6-4 8-2 2-3 4-3 6 0 3 3 6 7 6ZM9 18c0-2 2-3 3-5 1 2 3 3 3 5" />
    </symbol>
    <symbol id="icon-image" viewBox="0 0 24 24">
      <rect x="3" y="4" width="18" height="16" rx="2" />
      <circle cx="9" cy="10" r="2" />
      <path d="m21 15-5-5L5 20" />
    </symbol>
    <symbol id="icon-video" viewBox="0 0 24 24">
      <rect x="3" y="5" width="14" height="14" rx="2" />
      <path d="m17 10 4-2v8l-4-2" />
    </symbol>
    <symbol id="icon-chevron-left" viewBox="0 0 24 24">
      <path d="m15 18-6-6 6-6" />
    </symbol>
    <symbol id="icon-chevron-right" viewBox="0 0 24 24">
      <path d="m9 18 6 6-6 6" transform="translate(0 -12)" />
    </symbol>
    <symbol id="icon-close" viewBox="0 0 24 24">
      <path d="M18 6 6 18M6 6l12 12" />
    </symbol>
    <symbol id="icon-bookmark" viewBox="0 0 24 24">
      <path d="M6 3h12v18l-6-4-6 4z" />
    </symbol>
    <symbol id="icon-download" viewBox="0 0 24 24">
      <path d="M12 3v12m-5-5 5 5 5-5M5 21h14" />
    </symbol>
    <symbol id="icon-upload" viewBox="0 0 24 24">
      <path d="M12 16V4m-5 5 5-5 5 5M5 20h14" />
    </symbol>
    <symbol id="icon-external" viewBox="0 0 24 24">
      <path d="M14 3h7v7M10 14 21 3M21 14v6a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h6" />
    </symbol>
    <symbol id="icon-copy" viewBox="0 0 24 24">
      <rect x="9" y="9" width="12" height="12" rx="2" />
      <path d="M5 15H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v1" />
    </symbol>
    <symbol id="icon-delete" viewBox="0 0 24 24">
      <path d="M3 6h18M8 6V4h8v2M7 6l1 15h8l1-15" />
    </symbol>
    <symbol id="icon-arrow-up" viewBox="0 0 24 24">
      <path d="m6 15 6-6 6 6" />
    </symbol>
    <symbol id="icon-wifi-off" viewBox="0 0 24 24">
      <path d="m3 3 18 18M5 10a12 12 0 0 1 3-1.6M11 6.1A12 12 0 0 1 19 10M8.5 14a5 5 0 0 1 7 0M12 19h.01" />
    </symbol>
    <symbol id="icon-more" viewBox="0 0 24 24">
      <circle cx="5" cy="12" r="1" />
      <circle cx="12" cy="12" r="1" />
      <circle cx="19" cy="12" r="1" />
    </symbol>
  </svg>

  <div class="app-shell">
    <header class="top-app-bar">
      <a class="brand" href="/" aria-label="Atlas Gallery 首页">
        <span class="brand-mark">
          <svg class="icon"><use href="#icon-gallery"></use></svg>
        </span>
        <span class="brand-copy">
          <strong>Atlas Gallery</strong>
          <small>多站点媒体图库</small>
        </span>
      </a>

      <nav class="view-tabs" aria-label="内容视图">
        <button class="view-tab is-active" type="button" data-view="popular">
          <svg class="icon"><use href="#icon-fire"></use></svg>
          <span>热门</span>
        </button>
        <button class="view-tab" type="button" data-view="favorites">
          <svg class="icon"><use href="#icon-favorite"></use></svg>
          <span>收藏</span>
          <span class="tab-count" id="favoriteCount">0</span>
        </button>
      </nav>

      <div class="top-actions">
        <span class="network-status" id="networkStatus" aria-live="polite"></span>
        <button class="icon-button" id="refreshButton" type="button" title="刷新内容">
          <svg class="icon"><use href="#icon-refresh"></use></svg>
        </button>
        <button class="icon-button" id="settingsButton" type="button" title="全局设置">
          <svg class="icon"><use href="#icon-tune"></use></svg>
        </button>
      </div>
    </header>

    <section class="control-surface" id="controlSurface">
      <div class="source-row">
        <span class="control-label">站点来源</span>
        <div class="source-scroller" id="sourceList" role="list"></div>
      </div>

      <div class="filter-row">
        <div class="segmented-control" id="mediaTypeControl" aria-label="媒体类型">
          <button class="segment is-active" type="button" data-media-type="image">
            <svg class="icon"><use href="#icon-image"></use></svg>
            图片
          </button>
          <button class="segment" type="button" data-media-type="video">
            <svg class="icon"><use href="#icon-video"></use></svg>
            视频
          </button>
        </div>

        <form class="search-field" id="searchForm" role="search">
          <svg class="icon search-icon"><use href="#icon-search"></use></svg>
          <input
            id="tagInput"
            type="search"
            autocomplete="off"
            placeholder="搜索标签，使用 -tag 排除"
            aria-label="搜索标签"
          >
          <button class="search-submit" type="submit">搜索</button>
        </form>

        <button class="tonal-button" id="savedSearchButton" type="button">
          <svg class="icon"><use href="#icon-bookmark"></use></svg>
          搜索集
        </button>
      </div>

      <div class="advanced-row" id="advancedFilters">
        <div class="filter-cluster">
          <span class="control-label">内容分级</span>
          <div class="chip-group" id="ratingFilters">
            <button class="filter-chip is-selected" type="button" data-rating="safe">安全</button>
            <button class="filter-chip" type="button" data-rating="questionable">敏感</button>
            <button class="filter-chip" type="button" data-rating="explicit">成人</button>
          </div>
        </div>

        <div class="filter-cluster date-filter" id="dateFilter">
          <span class="control-label">热门周期</span>
          <div class="chip-group" id="periodFilters">
            <button class="filter-chip" type="button" data-period="day">日</button>
            <button class="filter-chip is-selected" type="button" data-period="week">周</button>
            <button class="filter-chip" type="button" data-period="month">月</button>
            <button class="filter-chip" type="button" data-period="year">年</button>
          </div>
          <div class="date-stepper">
            <button class="mini-icon-button" id="previousDate" type="button" title="上一周期">
              <svg class="icon"><use href="#icon-chevron-left"></use></svg>
            </button>
            <input id="anchorDate" type="date" aria-label="基准日期">
            <button class="mini-icon-button" id="nextDate" type="button" title="下一周期">
              <svg class="icon"><use href="#icon-chevron-right"></use></svg>
            </button>
          </div>
        </div>

        <p class="capability-note" id="capabilityNote"></p>
      </div>

      <div class="recent-searches" id="recentSearches" hidden>
        <span class="control-label">最近搜索</span>
        <div class="chip-group" id="recentSearchList"></div>
      </div>
    </section>

    <main class="main-content" id="mainContent">
      <header class="section-header">
        <div class="section-title-wrap">
          <span class="section-icon">
            <svg class="icon"><use id="sectionIconUse" href="#icon-fire"></use></svg>
          </span>
          <div>
            <h1 id="sectionTitle">热门图库</h1>
            <p id="sectionSubtitle">按热度浏览多个站点的图片与视频</p>
          </div>
        </div>
        <span class="result-count" id="resultCount">0 项</span>
      </header>

      <div class="message-banner" id="messageBanner" hidden role="alert">
        <span id="messageText"></span>
        <button class="text-button" id="retryButton" type="button">重试</button>
      </div>

      <div class="gallery-grid" id="gallery" aria-live="polite"></div>
      <div class="loading-more" id="loadingMore" hidden>正在加载更多内容</div>
      <div id="loadSentinel" aria-hidden="true"></div>
    </main>
  </div>

  <button class="fab" id="backToTop" type="button" title="返回顶部" hidden>
    <svg class="icon"><use href="#icon-arrow-up"></use></svg>
  </button>

  <div class="drawer" id="settingsDrawer" aria-hidden="true">
    <button class="drawer-scrim" type="button" data-close-drawer aria-label="关闭设置"></button>
    <aside class="drawer-panel" aria-label="全局设置">
      <header class="drawer-header">
        <div>
          <h2>全局设置</h2>
          <p>设置保存在当前浏览器</p>
        </div>
        <button class="icon-button" type="button" data-close-drawer title="关闭">
          <svg class="icon"><use href="#icon-close"></use></svg>
        </button>
      </header>

      <section class="settings-section">
        <h3>外观</h3>
        <div class="setting-block">
          <span class="setting-label">界面主题</span>
          <div class="segmented-control full-width" id="themeControl">
            <button class="segment is-active" type="button" data-theme-value="light">明亮</button>
            <button class="segment" type="button" data-theme-value="dark">深色</button>
          </div>
        </div>
        <div class="setting-block">
          <span class="setting-label">主题色</span>
          <div class="color-options" id="accentOptions">
            <button class="color-swatch is-selected" type="button" data-accent-value="blue" title="Google 蓝"></button>
            <button class="color-swatch" type="button" data-accent-value="green" title="青绿"></button>
            <button class="color-swatch" type="button" data-accent-value="coral" title="珊瑚红"></button>
            <button class="color-swatch" type="button" data-accent-value="violet" title="紫罗兰"></button>
          </div>
        </div>
      </section>

      <section class="settings-section">
        <h3>浏览体验</h3>
        <label class="setting-row">
          <span><strong>隐藏预览详情</strong><small>预览时不显示右侧信息栏</small></span>
          <input type="checkbox" data-setting="hideDetails">
        </label>
        <label class="setting-row">
          <span><strong>视频自动播放</strong><small>打开视频后静音自动播放</small></span>
          <input type="checkbox" data-setting="autoplay">
        </label>
        <label class="setting-row">
          <span><strong>模糊敏感缩略图</strong><small>预览前保护敏感内容</small></span>
          <input type="checkbox" data-setting="blurSensitive">
        </label>
        <label class="setting-row">
          <span><strong>紧凑网格</strong><small>同屏显示更多媒体</small></span>
          <input type="checkbox" data-setting="compactGrid">
        </label>
        <label class="setting-row">
          <span><strong>减少动画</strong><small>关闭位移和缩放动画</small></span>
          <input type="checkbox" data-setting="reduceMotion">
        </label>
      </section>

      <section class="settings-section">
        <h3>网络</h3>
        <label class="text-field">
          <span>自定义 CORS 代理模板</span>
          <input id="proxyTemplate" type="url" placeholder="https://proxy.example/?url={url}">
          <small>npm 服务默认使用同源代理；模板必须包含 {url}</small>
        </label>
      </section>

      <section class="settings-section">
        <h3>数据</h3>
        <div class="button-row">
          <button class="outlined-button" id="exportButton" type="button">
            <svg class="icon"><use href="#icon-download"></use></svg>
            导出收藏
          </button>
          <button class="outlined-button" id="importButton" type="button">
            <svg class="icon"><use href="#icon-upload"></use></svg>
            导入收藏
          </button>
          <input id="importFile" type="file" accept="application/json,.json" hidden>
        </div>
        <button class="danger-button" id="resetButton" type="button">
          <svg class="icon"><use href="#icon-delete"></use></svg>
          清除全部本地数据
        </button>
      </section>
    </aside>
  </div>

  <dialog class="saved-search-dialog" id="savedSearchDialog">
    <header class="dialog-header">
      <div>
        <h2>搜索集</h2>
        <p>保存并快速恢复常用筛选条件</p>
      </div>
      <button class="icon-button" id="closeSavedSearch" type="button" title="关闭">
        <svg class="icon"><use href="#icon-close"></use></svg>
      </button>
    </header>
    <form class="save-search-form" id="saveSearchForm">
      <label class="text-field compact">
        <span>名称</span>
        <input id="savedSearchName" maxlength="40" required placeholder="例如：本周壁纸">
      </label>
      <button class="filled-button" type="submit">保存当前搜索</button>
    </form>
    <div class="saved-search-list" id="savedSearchList"></div>
  </dialog>

  <dialog class="preview-dialog" id="previewDialog">
    <section class="preview-stage" id="previewStage">
      <button class="preview-close" id="closePreview" type="button" title="关闭预览">
        <svg class="icon"><use href="#icon-close"></use></svg>
      </button>
      <button class="preview-nav previous" id="previousPreview" type="button" title="上一项">
        <svg class="icon"><use href="#icon-chevron-left"></use></svg>
      </button>
      <div class="preview-media" id="previewMedia"></div>
      <button class="preview-nav next" id="nextPreview" type="button" title="下一项">
        <svg class="icon"><use href="#icon-chevron-right"></use></svg>
      </button>
    </section>
    <aside class="preview-details" id="previewDetails"></aside>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script type="module" src="/js/app.js?v=2.0.0"></script>
</body>
</html>
