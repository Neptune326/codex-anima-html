<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>Atlas Gallery</title>
  <style>
    :root{--accent:#65d1a3;--accent-rgb:101,209,163;--bg:#0d1117;--panel:#151b23;--panel-2:#1b232d;--line:#2b3542;--text:#edf2f7;--muted:#94a3b8;--danger:#ff6b81;--warning:#f7c873;--radius:7px;--card-min:230px;--shadow:0 18px 60px rgba(0,0,0,.32)}
    [data-theme="light"]{--bg:#f5f7fa;--panel:#fff;--panel-2:#eef2f6;--line:#d7dee7;--text:#17202c;--muted:#64748b;--shadow:0 16px 48px rgba(25,36,50,.14)}
    *{box-sizing:border-box}html,body{height:100%}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 Inter,"Segoe UI","Microsoft YaHei",sans-serif;overflow:hidden}button,input{font:inherit;color:inherit}button{cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}svg{display:block}
    .app{height:100%;display:grid;grid-template-rows:auto auto 1fr}.topbar{min-height:68px;padding:12px 20px;display:flex;align-items:center;gap:22px;border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--panel) 92%,transparent);backdrop-filter:blur(18px)}
    .brand{display:flex;align-items:center;gap:11px;min-width:205px}.brand-mark{width:38px;height:38px;display:grid;place-items:center;border:1px solid rgba(var(--accent-rgb),.5);background:rgba(var(--accent-rgb),.12);color:var(--accent);border-radius:8px}.brand h1{font-size:17px;margin:0;letter-spacing:0}.brand p{margin:1px 0 0;color:var(--muted);font-size:12px}
    .views,.segmented,.sources{display:flex;align-items:center;gap:4px}.views{padding:3px;background:var(--panel-2);border:1px solid var(--line);border-radius:7px}.views button,.segmented button,.source-btn{border:0;background:transparent;color:var(--muted);border-radius:5px;padding:7px 11px;white-space:nowrap}.views button.active,.segmented button.active,.source-btn.active{background:var(--panel);color:var(--text);box-shadow:0 1px 5px rgba(0,0,0,.16)}.views button.active{color:var(--accent)}
    .top-spacer{flex:1}.icon-btn{width:36px;height:36px;border:1px solid var(--line);background:var(--panel);border-radius:7px;display:grid;place-items:center}.icon-btn:hover,.btn:hover,.source-btn:hover{border-color:rgba(var(--accent-rgb),.65);color:var(--accent)}
    .filters{padding:13px 20px;display:flex;align-items:center;gap:16px;border-bottom:1px solid var(--line);background:var(--panel);overflow-x:auto}.filter-group{display:flex;align-items:center;gap:8px;white-space:nowrap}.label{font-size:11px;color:var(--muted);text-transform:uppercase}.sources{gap:5px}.source-btn{border:1px solid transparent;padding:7px 10px}.source-btn.active{border-color:rgba(var(--accent-rgb),.45);background:rgba(var(--accent-rgb),.1);color:var(--accent)}
    .date-wrap{display:flex;align-items:center;border:1px solid var(--line);border-radius:7px;overflow:hidden}.date-wrap button{width:31px;height:32px;border:0;background:transparent}.date-wrap input{height:32px;border:0;border-inline:1px solid var(--line);background:transparent;padding:0 8px;color-scheme:dark}.search{min-width:260px;flex:1;max-width:430px;display:flex;align-items:center;gap:8px;height:36px;padding:0 10px;border:1px solid var(--line);border-radius:7px;background:var(--bg)}.search:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px rgba(var(--accent-rgb),.1)}.search input{min-width:0;flex:1;border:0;outline:0;background:transparent}.btn{height:36px;border:1px solid var(--line);background:var(--panel-2);border-radius:7px;padding:0 12px;display:inline-flex;align-items:center;gap:7px}.btn.primary{background:var(--accent);border-color:var(--accent);color:#07130f;font-weight:700}.btn.danger{color:var(--danger)}
    .workspace{min-height:0;display:grid;grid-template-columns:1fr}.content{min-width:0;overflow:auto;padding:18px 20px 50px}.section-head{display:flex;align-items:center;gap:12px;margin-bottom:17px}.section-head .title-icon{width:35px;height:35px;display:grid;place-items:center;color:var(--accent);background:rgba(var(--accent-rgb),.1);border:1px solid rgba(var(--accent-rgb),.25);border-radius:7px}.section-head h2{font-size:20px;margin:0}.section-head p{margin:1px 0 0;color:var(--muted);font-size:12px}.section-head .count{margin-left:auto;color:var(--muted)}
    .notice{margin-bottom:14px;padding:10px 12px;border:1px solid rgba(247,200,115,.38);background:rgba(247,200,115,.08);color:var(--warning);border-radius:7px;display:none}.notice.show{display:block}.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,var(--card-min)),1fr));gap:12px}.card{position:relative;min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;transition:transform .16s,border-color .16s}.card:hover{transform:translateY(-2px);border-color:rgba(var(--accent-rgb),.62)}.media{position:relative;display:block;width:100%;aspect-ratio:4/3;border:0;padding:0;background:var(--panel-2);overflow:hidden}.media img{width:100%;height:100%;object-fit:cover;display:block;transition:opacity .2s,transform .25s}.card:hover img{transform:scale(1.025)}.media img.loading{opacity:.2}.sensitive img{filter:blur(18px)}.sensitive:hover img{filter:blur(0)}.badge{position:absolute;left:8px;top:8px;padding:3px 7px;background:rgba(8,12,17,.8);color:#fff;border-radius:5px;font-size:11px;display:flex;align-items:center;gap:4px}.rating{left:auto;right:8px}.rating.explicit{color:#ff9aaa}.card-body{height:48px;padding:8px 10px;display:flex;align-items:center;gap:10px}.score{font-weight:700}.meta{color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.favorite{margin-left:auto;width:30px;height:30px;border:0;background:transparent;color:var(--muted);display:grid;place-items:center;border-radius:5px}.favorite.active{color:var(--danger)}.favorite.active svg{fill:currentColor}.empty{grid-column:1/-1;min-height:360px;display:grid;place-items:center;text-align:center;color:var(--muted)}.empty h3{color:var(--text);margin:12px 0 4px}.loader{display:none;justify-content:center;align-items:center;gap:9px;padding:28px;color:var(--muted)}.loader.show{display:flex}.spin{animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
    .drawer{position:fixed;inset:0;z-index:50;pointer-events:none}.drawer.open{pointer-events:auto}.drawer-backdrop{position:absolute;inset:0;background:rgba(0,0,0,.45);opacity:0;transition:.2s}.drawer.open .drawer-backdrop{opacity:1}.drawer-panel{position:absolute;right:0;top:0;height:100%;width:min(430px,100%);background:var(--panel);border-left:1px solid var(--line);transform:translateX(100%);transition:.22s;box-shadow:var(--shadow);padding:20px;overflow:auto}.drawer.open .drawer-panel{transform:none}.drawer-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px}.drawer-head h2{margin:0;font-size:19px}.setting{padding:15px 0;border-bottom:1px solid var(--line)}.setting-row{display:flex;align-items:center;justify-content:space-between;gap:18px}.setting strong{display:block}.setting small{display:block;color:var(--muted);margin-top:2px}.toggle{width:42px;height:24px;border:0;border-radius:20px;background:var(--line);padding:3px}.toggle span{display:block;width:18px;height:18px;background:#fff;border-radius:50%;transition:.18s}.toggle.on{background:var(--accent)}.toggle.on span{transform:translateX(18px)}.swatches{display:flex;gap:8px;margin-top:12px}.swatch{width:29px;height:29px;border:2px solid transparent;border-radius:50%;background:var(--swatch)}.swatch.active{border-color:var(--text);box-shadow:0 0 0 2px var(--panel)}.field{margin-top:10px}.field label{display:block;color:var(--muted);font-size:12px;margin-bottom:5px}.field input{width:100%;height:37px;border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:0 10px;outline:0}.field input:focus{border-color:var(--accent)}
    .modal{position:fixed;inset:0;z-index:60;display:none;background:rgba(3,6,10,.92)}.modal.open{display:grid;grid-template-columns:minmax(0,1fr) 350px}.modal.no-details{grid-template-columns:1fr}.preview-stage{position:relative;min-width:0;display:grid;place-items:center;overflow:hidden}.preview-stage img,.preview-stage video{max-width:100%;max-height:100%;object-fit:contain}.preview-stage video{width:100%;height:100%}.details{border-left:1px solid var(--line);background:var(--panel);padding:22px;overflow:auto}.modal.no-details .details{display:none}.modal-close{position:absolute;right:14px;top:14px;z-index:2;background:rgba(10,14,20,.75);color:#fff}.nav{position:absolute;top:50%;z-index:2;width:42px;height:58px;border:1px solid rgba(255,255,255,.2);background:rgba(10,14,20,.68);color:#fff;border-radius:7px;display:grid;place-items:center}.nav.prev{left:14px}.nav.next{right:14px}.details h2{font-size:21px;margin:8px 0 18px}.details dl{margin:0}.details dl div{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line)}.details dt{color:var(--muted)}.details dd{margin:0}.tags{display:flex;flex-wrap:wrap;gap:6px;margin:17px 0}.tag{border:1px solid var(--line);background:var(--panel-2);border-radius:5px;padding:3px 6px;font-size:11px;color:var(--muted)}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.actions .btn{justify-content:center}.actions .wide{grid-column:1/-1}
    .toast{position:fixed;left:50%;bottom:24px;z-index:90;transform:translate(-50%,20px);opacity:0;background:var(--text);color:var(--bg);padding:9px 14px;border-radius:7px;pointer-events:none;transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}
    @media(max-width:980px){.brand{min-width:auto}.brand p{display:none}.filters{gap:12px}.label{display:none}.modal.open{grid-template-columns:1fr}.modal.open .details{position:absolute;right:0;top:0;bottom:0;width:min(350px,90vw);box-shadow:var(--shadow)}.modal.no-details .details{display:none}}
    @media(max-width:680px){.topbar{padding:10px 12px;gap:10px}.brand h1{display:none}.topbar .views{margin-left:auto}.filters{padding:10px 12px}.content{padding:14px 12px 42px}.search{min-width:230px}.gallery{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}:root{--card-min:150px}.card-body{padding:6px 8px}.meta{display:none}.section-head h2{font-size:18px}}
  </style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand"><div class="brand-mark" data-icon="aperture"></div><div><h1>Atlas Gallery</h1><p>多站点媒体浏览器</p></div></div>
    <nav class="views"><button class="active" data-view="popular">热门</button><button data-view="favorites">收藏 <span id="favoriteCount">0</span></button></nav>
    <div class="top-spacer"></div>
    <button class="icon-btn" id="refreshBtn" title="刷新" data-icon="refresh"></button>
    <button class="icon-btn" id="settingsBtn" title="全局设置" data-icon="settings"></button>
  </header>
  <div class="filters" id="filters">
    <div class="filter-group"><span class="label">站点</span><div class="sources" id="sources"></div></div>
    <div class="filter-group segmented" id="mediaTypes"><button class="active" data-value="image" data-icon-text="image">图片</button><button data-value="video" data-icon-text="video">视频</button></div>
    <div class="filter-group segmented" id="periods"><button data-value="day">日</button><button class="active" data-value="week">周</button><button data-value="month">月</button><button data-value="year">年</button></div>
    <div class="date-wrap"><button id="prevDate" data-icon="left"></button><input id="anchorDate" type="date"><button id="nextDate" data-icon="right"></button></div>
    <form class="search" id="searchForm"><span data-icon="search"></span><input id="tagInput" placeholder="标签，空格分隔；-tag 排除"><button class="icon-btn" style="width:27px;height:27px;border:0" title="搜索" data-icon="arrow"></button></form>
    <button class="btn" id="ratingBtn">分级：安全</button>
    <button class="btn" id="presetBtn" data-icon-text="bookmark">预设</button>
  </div>
  <main class="workspace"><section class="content" id="content">
    <div class="section-head"><div class="title-icon" data-icon="flame"></div><div><h2 id="sectionTitle">热门图库</h2><p id="sectionSub">按热度浏览多个站点的图片与视频</p></div><span class="count" id="resultCount">0 项</span></div>
    <div class="notice" id="notice"></div><div class="gallery" id="gallery"></div><div class="loader" id="loader"><span class="spin" data-icon="loader"></span>正在加载</div><div id="sentinel"></div>
  </section></main>
</div>
<div class="drawer" id="drawer"><div class="drawer-backdrop" data-close-settings></div><aside class="drawer-panel"><div class="drawer-head"><div><h2>全局设置</h2><span class="label">保存在当前浏览器</span></div><button class="icon-btn" data-close-settings data-icon="close"></button></div>
  <div class="setting"><strong>主题色</strong><small>调整强调色与交互状态</small><div class="swatches" id="swatches"></div></div>
  <div class="setting"><div class="setting-row"><div><strong>浅色界面</strong><small>切换整体明暗主题</small></div><button class="toggle" data-setting="light"><span></span></button></div></div>
  <div class="setting"><div class="setting-row"><div><strong>隐藏预览详情</strong><small>预览时不展示右侧信息区域</small></div><button class="toggle" data-setting="hideDetails"><span></span></button></div></div>
  <div class="setting"><div class="setting-row"><div><strong>视频自动播放</strong><small>打开视频预览后立即静音播放</small></div><button class="toggle" data-setting="autoplay"><span></span></button></div></div>
  <div class="setting"><div class="setting-row"><div><strong>模糊敏感缩略图</strong><small>鼠标移入后临时显示</small></div><button class="toggle" data-setting="blurSensitive"><span></span></button></div></div>
  <div class="setting"><div class="setting-row"><div><strong>紧凑网格</strong><small>每行展示更多内容</small></div><button class="toggle" data-setting="compact"><span></span></button></div></div>
  <div class="setting"><strong>自定义代理模板（可选）</strong><small>通过 npm 服务访问时自动使用同源代理；仅在需要覆盖默认代理时填写 <code>{url}</code> 模板</small><div class="field"><input id="proxyTemplate" placeholder="例如：https://proxy.example/?url={url}"></div></div>
  <div class="setting"><button class="btn danger" id="clearDataBtn" data-icon-text="trash">清除本地收藏与设置</button></div>
</aside></div>
<div class="modal" id="modal"><div class="preview-stage" id="previewStage"><button class="icon-btn modal-close" id="modalClose" data-icon="close"></button><button class="nav prev" id="modalPrev" data-icon="left"></button><button class="nav next" id="modalNext" data-icon="right"></button><div id="previewMedia"></div></div><aside class="details" id="details"></aside></div>
<div class="toast" id="toast"></div>
<script>
(()=>{"use strict";

'<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 1 1-6.2-8.6"/></svg>',image:'<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="m21 15-5-5L5 20"/></svg>',video:'<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="14" height="14" rx="2"/><path d="m17 10 4-2v8l-4-2"/></svg>',heart:'<svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8l1.1 1.1L12 21l7.8-7.5 1.1-1.1a5.5 5.5 0 0 0-.1-7.8Z"/></svg>',download:'<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12m-5-5 5 5 5-5M5 21h14"/></svg>',external:'<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 3h7v7M10 14 21 3M21 14v6a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h6"/></svg>',copy:'<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v1"/></svg>',bookmark:'<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 3h12v18l-6-4-6 4z"/></svg>',trash:'<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4h8v2m-9 0 1 15h8l1-15"/></svg>'};
document.querySelectorAll('[data-icon]').forEach(e=>e.innerHTML=ICONS[e.dataset.icon]||'');document.querySelectorAll('[data-icon-text]').forEach(e=>e.insertAdjacentHTML('afterbegin',ICONS[e.dataset.iconText]||''));
const SOURCES={yandere:{name:'yande.re',home:'https://yande.re/',api:'https://yande.re/post.json',build:q=>{let u=new URL('https://yande.re/post.json');u.searchParams.set('limit','40');u.searchParams.set('page',q.page);u.searchParams.set('tags',['order:score',...q.tags,...q.excluded.map(x=>'-'+x),q.media==='video'?'video':'-video',`date:${q.start}..${q.end}`].join(' '));return u},parse:p=>p.map(x=>norm('yandere',x.id,x.score,x.rating,x.created_at,x.width,x.height,x.tags,x.preview_url,x.sample_url,x.file_url,`https://yande.re/post/show/${x.id}`))},gelbooru:{name:'Gelbooru',home:'https://gelbooru.com/',api:'https://gelbooru.com/index.php',build:q=>{let u=new URL('https://gelbooru.com/index.php');Object.entries({page:'dapi',s:'post',q:'index',json:'1',limit:'40',pid:q.page-1,tags:['sort:score:desc',...q.tags,...q.excluded.map(x=>'-'+x),q.media==='video'?'video':'-video'].join(' ')}).forEach(([k,v])=>u.searchParams.set(k,v));return u},parse:p=>(Array.isArray(p)?p:p.post||[]).map(x=>norm('gelbooru',x.id,x.score,x.rating,x.created_at,x.width,x.height,x.tags,x.preview_url,x.sample_url||x.file_url,x.file_url,`https://gelbooru.com/index.php?page=post&s=view&id=${x.id}`))},danbooru:{name:'Danbooru',home:'https://danbooru.donmai.us/',api:'https://danbooru.donmai.us/posts.json',build:q=>{let u=new URL('https://danbooru.donmai.us/posts.json');u.searchParams.set('limit','40');u.searchParams.set('page',q.page);u.searchParams.set('tags',['order:score_desc',...q.tags,...q.excluded.map(x=>'-'+x),...(q.media==='video'?['filetype:mp4']:[])].join(' '));return u},parse:p=>p.map(x=>norm('danbooru',x.id,x.score,x.rating,x.created_at,x.image_width,x.image_height,x.tag_string,x.preview_file_url,x.large_file_url||x.file_url,x.file_url,`https://danbooru.donmai.us/posts/${x.id}`,x.file_ext))},sankaku:{name:'Sankaku',home:'https://chan.sankakucomplex.com/',api:'https://capi-v2.sankakucomplex.com/posts',build:q=>{let u=new URL('https://capi-v2.sankakucomplex.com/posts');u.searchParams.set('limit','40');u.searchParams.set('page',q.page);u.searchParams.set('tags',['order:popular',...q.tags,...q.excluded.map(x=>'-'+x),q.media==='video'?'video':''].join(' '));return u},parse:p=>(p.data||p||[]).map(x=>norm('sankaku',x.id,x.total_score??x.score,x.rating,x.created_at,x.width,x.height,(x.tags||[]).map(t=>t.name_en||t.name).join(' '),x.preview_url||x.preview?.url,x.sample_url||x.sample?.url||x.file_url,x.file_url||x.file?.url,`https://chan.sankakucomplex.com/post/show/${x.id}`,x.file_type))},safebooru:{name:'Safebooru',home:'https://safebooru.org/',api:'https://safebooru.org/index.php',build:q=>{let u=new URL('https://safebooru.org/index.php');Object.entries({page:'dapi',s:'post',q:'index',json:'1',limit:'40',pid:q.page-1,tags:['sort:score:desc',...q.tags,...q.excluded.map(x=>'-'+x)].join(' ')}).forEach(([k,v])=>u.searchParams.set(k,v));return u},parse:p=>(Array.isArray(p)?p:p.post||[]).map(x=>norm('safebooru',x.id,x.score,'safe',x.change,x.width,x.height,x.tags,x.preview_url,x.sample_url||x.file_url,x.file_url,`https://safebooru.org/index.php?page=post&s=view&id=${x.id}`))},rule34:{name:'Rule34',home:'https://rule34.xxx/',api:'https://api.rule34.xxx/index.php',build:q=>{let u=new URL('https://api.rule34.xxx/index.php');Object.entries({page:'dapi',s:'post',q:'index',json:'1',limit:'40',pid:q.page-1,tags:['sort:score:desc',...q.tags,...q.excluded.map(x=>'-'+x),q.media==='video'?'video':'-video'].join(' ')}).forEach(([k,v])=>u.searchParams.set(k,v));return u},parse:p=>(Array.isArray(p)?p:p.post||[]).map(x=>norm('rule34',x.id,x.score,x.rating,x.created_at,x.width,x.height,x.tags,x.preview_url,x.sample_url||x.file_url,x.file_url,`https://rule34.xxx/index.php?page=post&s=view&id=${x.id}`))}};
const defaults={source:'yandere',media:'image',period:'week',ratings:['safe'],view:'popular',settings:{light:true,hideDetails:false,autoplay:true,blurSensitive:true,compact:false,accent:'#65d1a3',proxy:''},favorites:{},presets:[]};let state=load();let posts=[],page=1,loading=false,hasMore=true,selected=-1;
const $=s=>document.querySelector(s),gallery=$('#gallery'),notice=$('#notice'),loader=$('#loader');function load(){try{return deep(defaults,JSON.parse(localStorage.getItem('atlas-gallery')||'{}'))}catch{return structuredClone(defaults)}}function deep(a,b){const o={...a,...b};o.settings={...a.settings,...b.settings};o.favorites=b.favorites||{};o.presets=b.presets||[];return o}function save(){localStorage.setItem('atlas-gallery',JSON.stringify(state))}
function norm(source,id,score,rating,date,w,h,tags,preview,sample,file,post,ext=''){const clean=u=>u?new URL(u,SOURCES[source].home).href.replace(/^http:/,'https:'):'';rating=String(rating||'').toLowerCase();rating=['g','s','safe','general','sensitive'].includes(rating)?'safe':rating==='q'||rating==='questionable'?'questionable':'explicit';const f=clean(file),type=/video|mp4|webm|mov/i.test(String(ext)+' '+f)?'video':'image';return{source,id:String(id),score:Number(score)||0,rating,date:date?new Date(Number(date)<1e11?Number(date)*1000:date).toISOString():'',width:Number(w)||0,height:Number(h)||0,tags:Array.isArray(tags)?tags.map(x=>typeof x==='string'?x:x.name_en||x.name).filter(Boolean):String(tags||'').split(/\s+/).filter(Boolean),preview:clean(preview),sample:clean(sample)||f,file:f,post,type}}
function windowDates(){let d=new Date($('#anchorDate').value+'T12:00:00'),s=new Date(d),e=new Date(d);if(state.period==='week'){let day=(d.getDay()+6)%7;s.setDate(d.getDate()-day);e=new Date(s);e.setDate(s.getDate()+6)}else if(state.period==='month'){s=new Date(d.getFullYear(),d.getMonth(),1);e=new Date(d.getFullYear(),d.getMonth()+1,0)}else if(state.period==='year'){s=new Date(d.getFullYear(),0,1);e=new Date(d.getFullYear(),11,31)}return{start:fmt(s),end:fmt(e)}}function fmt(d){return[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')}
function requestTarget(url){if(state.settings.proxy)return state.settings.proxy.replace('{url}',encodeURIComponent(url));if(location.protocol==='http:'||location.protocol==='https:')return `/api/proxy?url=${encodeURIComponent(url)}`;return url}
async function request(url){const r=await fetch(requestTarget(url),{credentials:'omit',headers:{Accept:'application/json,text/plain,*/*'}});if(!r.ok){let detail='';try{detail=(await r.json()).error||''}catch{}throw new Error(detail||`HTTP ${r.status}`)}return r.json()}
async function fetchPosts(reset=false){if(loading||(!hasMore&&!reset)||state.view==='favorites')return;if(reset){posts=[];page=1;hasMore=true;gallery.innerHTML=''}loading=true;loader.classList.add('show');notice.classList.remove('show');try{const src=SOURCES[state.source],q={page,media:state.media,tags:parseTags().include,excluded:parseTags().exclude,...windowDates()},data=await request(src.build(q).href);let rows=src.parse(data).filter(p=>p.preview&&p.file&&p.type===state.media&&state.ratings.includes(p.rating));rows.sort((a,b)=>b.score-a.score);posts=[...new Map([...posts,...rows].map(p=>[p.source+':'+p.id,p])).values()];hasMore=rows.length>=35;page++;render()}catch(e){const hint=location.protocol==='file:'?'请通过 npm start 启动后访问页面，或填写自定义代理模板。':'请检查服务端网络、目标站点状态或自定义代理设置。';showNotice(`${SOURCES[state.source].name} 请求失败：${e.message}。${hint}`);render()}finally{loading=false;loader.classList.remove('show')}}
function parseTags(){const arr=$('#tagInput').value.trim().split(/[\s,]+/).filter(Boolean);return{include:arr.filter(x=>!x.startsWith('-')),exclude:arr.filter(x=>x.startsWith('-')).map(x=>x.slice(1))}}
function visiblePosts(){return state.view==='favorites'?Object.values(state.favorites):posts}function render(){const rows=visiblePosts();$('#resultCount').textContent=`${rows.length} 项`;$('#favoriteCount').textContent=Object.keys(state.favorites).length;$('#sectionTitle').textContent=state.view==='favorites'?'我的收藏':'热门图库';$('#sectionSub').textContent=state.view==='favorites'?'收藏保存在当前浏览器':'按热度浏览多个站点的图片与视频';if(!rows.length){gallery.innerHTML=`<div class="empty"><div>${ICONS.image}<h3>${state.view==='favorites'?'还没有收藏':'没有可展示的内容'}</h3><span>${state.view==='favorites'?'点击卡片上的心形按钮保存内容':'调整站点、分级或标签后重试'}</span></div></div>`;return}gallery.innerHTML=rows.map((p,i)=>`<article class="card ${state.settings.blurSensitive&&p.rating!=='safe'?'sensitive':''}"><button class="media" data-open="${i}"><img class="loading" loading="lazy" src="${esc(p.preview)}" alt="${esc(p.tags.slice(0,5).join(', '))}" onload="this.classList.remove('loading')"><span class="badge">${p.type==='video'?ICONS.video:ICONS.image}${p.type==='video'?'视频':'图片'}</span><span class="badge rating ${p.rating}">${p.rating}</span></button><div class="card-body"><span class="score">▲ ${p.score}</span><span class="meta">${p.width} × ${p.height}</span><button class="favorite ${state.favorites[p.source+':'+p.id]?'active':''}" data-favorite="${i}" title="收藏">${ICONS.heart}</button></div></article>`).join('')}
function esc(v){return String(v||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function showNotice(t){notice.textContent=t;notice.classList.add('show')}function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('show'),1800)}
function applySettings(){document.documentElement.dataset.theme=state.settings.light?'light':'dark';document.documentElement.style.setProperty('--accent',state.settings.accent);document.documentElement.style.setProperty('--accent-rgb',hexRgb(state.settings.accent));document.documentElement.style.setProperty('--card-min',state.settings.compact?'175px':'230px');$('#proxyTemplate').value=state.settings.proxy;document.querySelectorAll('[data-setting]').forEach(b=>b.classList.toggle('on',!!state.settings[b.dataset.setting]));document.querySelectorAll('.swatch').forEach(b=>b.classList.toggle('active',b.dataset.color===state.settings.accent))}function hexRgb(h){return[1,3,5].map(i=>parseInt(h.slice(i,i+2),16)).join(',')}
function sync(){document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===state.view));document.querySelectorAll('#sources button').forEach(b=>b.classList.toggle('active',b.dataset.source===state.source));document.querySelectorAll('#mediaTypes button').forEach(b=>b.classList.toggle('active',b.dataset.value===state.media));document.querySelectorAll('#periods button').forEach(b=>b.classList.toggle('active',b.dataset.value===state.period));$('#filters').style.display=state.view==='favorites'?'none':'flex';$('#ratingBtn').textContent='分级：'+({safe:'安全',questionable:'可疑',explicit:'成人'}[state.ratings.join(',')]||state.ratings.length+' 项');applySettings();save()}
function openModal(i){selected=i;const p=visiblePosts()[i];if(!p)return;const modal=$('#modal');modal.classList.toggle('no-details',state.settings.hideDetails);$('#previewMedia').innerHTML=p.type==='video'?`<video src="${esc(p.file)}" poster="${esc(p.preview)}" controls ${state.settings.autoplay?'autoplay muted':''} playsinline></video>`:`<img src="${esc(p.sample||p.file)}" alt="${esc(p.tags.join(', '))}">`;$('#details').innerHTML=`<span class="label">${esc(SOURCES[p.source].name)}</span><h2>帖子 #${esc(p.id)}</h2><dl><div><dt>热度</dt><dd>${p.score}</dd></div><div><dt>尺寸</dt><dd>${p.width} × ${p.height}</dd></div><div><dt>分级</dt><dd>${p.rating}</dd></div><div><dt>发布时间</dt><dd>${p.date?new Date(p.date).toLocaleString('zh-CN'):'未知'}</dd></div></dl><div class="tags">${p.tags.slice(0,80).map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div><div class="actions"><button class="btn" id="modalFavorite">${ICONS.heart} 收藏</button><button class="btn" id="copyTags">${ICONS.copy} 标签</button><a class="btn primary wide" href="${esc(p.file)}" download target="_blank">${ICONS.download} 下载原文件</a><a class="btn wide" href="${esc(p.post)}" target="_blank" rel="noreferrer">${ICONS.external} 打开原帖</a></div>`;modal.classList.add('open');$('#modalFavorite').onclick=()=>toggleFavorite(p);$('#copyTags').onclick=()=>navigator.clipboard.writeText(p.tags.join(' ')).then(()=>toast('标签已复制'));$('#modalPrev').disabled=i<=0;$('#modalNext').disabled=i>=visiblePosts().length-1}
function closeModal(){$('#modal').classList.remove('open');$('#previewMedia').innerHTML=''}function toggleFavorite(p){const k=p.source+':'+p.id;if(state.favorites[k])delete state.favorites[k];else state.favorites[k]=p;save();render();if($('#modal').classList.contains('open'))toast(state.favorites[k]?'已收藏':'已取消收藏')}
$('#sources').innerHTML=Object.entries(SOURCES).map(([id,s])=>`<button class="source-btn" data-source="${id}" title="${s.home}">${s.name}</button>`).join('');const colors=['#65d1a3','#4aa8ff','#ff6f91','#f2bd54','#a58cff'];$('#swatches').innerHTML=colors.map(c=>`<button class="swatch" data-color="${c}" style="--swatch:${c}" title="${c}"></button>`).join('');$('#anchorDate').value=fmt(new Date());$('#anchorDate').max=fmt(new Date());
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.source){state.source=b.dataset.source;sync();fetchPosts(true)}if(b.dataset.view){state.view=b.dataset.view;sync();state.view==='favorites'?render():fetchPosts(true)}if(b.closest('#mediaTypes')){state.media=b.dataset.value;sync();fetchPosts(true)}if(b.closest('#periods')){state.period=b.dataset.value;sync();fetchPosts(true)}if(b.dataset.open!==undefined)openModal(Number(b.dataset.open));if(b.dataset.favorite!==undefined)toggleFavorite(visiblePosts()[Number(b.dataset.favorite)])});
$('#searchForm').onsubmit=e=>{e.preventDefault();fetchPosts(true)};$('#refreshBtn').onclick=()=>fetchPosts(true);$('#settingsBtn').onclick=()=>$('#drawer').classList.add('open');document.querySelectorAll('[data-close-settings]').forEach(x=>x.onclick=()=>$('#drawer').classList.remove('open'));$('#modalClose').onclick=closeModal;$('#modalPrev').onclick=()=>openModal(selected-1);$('#modalNext').onclick=()=>openModal(selected+1);$('#previewStage').onclick=e=>{if(e.target.id==='previewStage')closeModal()};
document.querySelectorAll('[data-setting]').forEach(b=>b.onclick=()=>{const k=b.dataset.setting;state.settings[k]=!state.settings[k];sync();render();if($('#modal').classList.contains('open'))openModal(selected)});document.querySelectorAll('.swatch').forEach(b=>b.onclick=()=>{state.settings.accent=b.dataset.color;sync()});$('#proxyTemplate').onchange=e=>{state.settings.proxy=e.target.value.trim();save()};$('#clearDataBtn').onclick=()=>{if(confirm('清除全部本地收藏、预设和设置？')){localStorage.removeItem('atlas-gallery');location.reload()}};
$('#ratingBtn').onclick=()=>{const modes=[['safe'],['safe','questionable'],['safe','questionable','explicit']];let i=modes.findIndex(x=>x.join()==state.ratings.join());state.ratings=modes[(i+1)%modes.length];sync();fetchPosts(true)};$('#presetBtn').onclick=()=>{const name=prompt('输入预设名称；留空可选择已有预设');if(name){state.presets.unshift({name,source:state.source,media:state.media,period:state.period,ratings:state.ratings,tags:$('#tagInput').value});save();toast('预设已保存')}else if(state.presets.length){const pick=prompt(state.presets.map((p,i)=>`${i+1}. ${p.name}`).join('\n')+'\n输入序号');const p=state.presets[Number(pick)-1];if(p){Object.assign(state,{source:p.source,media:p.media,period:p.period,ratings:p.ratings});$('#tagInput').value=p.tags;sync();fetchPosts(true)}}};
function shift(n){let d=new Date($('#anchorDate').value+'T12:00:00');d.setDate(d.getDate()+n*({day:1,week:7,month:30,year:365}[state.period]));if(d>new Date())d=new Date();$('#anchorDate').value=fmt(d);fetchPosts(true)}$('#prevDate').onclick=()=>shift(-1);$('#nextDate').onclick=()=>shift(1);$('#anchorDate').onchange=()=>fetchPosts(true);document.addEventListener('keydown',e=>{if(!$('#modal').classList.contains('open'))return;if(e.key==='Escape')closeModal();if(e.key==='ArrowLeft'&&selected>0)openModal(selected-1);if(e.key==='ArrowRight'&&selected<visiblePosts().length-1)openModal(selected+1)});
new IntersectionObserver(es=>{if(es[0].isIntersecting)fetchPosts(false)},{root:$('#content'),rootMargin:'500px'}).observe($('#sentinel'));sync();fetchPosts(true);
})();
</script>
